name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify (PostgreSQL & Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and run tests with Testcontainers
        run: ./mvnw -B clean verify
        env:
          # Testcontainers 1.19.7 defaults to API 1.32, below Docker 29's minimum.
          JAVA_TOOL_OPTIONS: "-Dapi.version=1.44"
          JWT_SECRET: "ci-pipeline-super-secret-key-that-is-at-least-256-bits-long-hs256"
          TELEGRAM_BOT_TOKEN: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
          TELEGRAM_BOT_USERNAME: "TaskCenterTestBot"

      - name: Publish Test Failures to Step Summary
        if: failure()
        run: |
          echo "## ❌ Test Failures Report" >> $GITHUB_STEP_SUMMARY
          found=0
          for f in target/surefire-reports/*.txt; do
            if grep -q -E "(FAILURE!|ERROR!)" "$f" 2>/dev/null; then
              found=1
              echo "### 📄 $(basename "$f")" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              cat "$f" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              ERR_MSG=$(grep -E "(FAILURE!|ERROR!|<<< FAILURE|<<< ERROR)" "$f" | head -n 3 | tr '\n' ' ')
              echo "::error file=src/test,title=$(basename "$f")::$ERR_MSG"
            fi
          done
          if [ $found -eq 0 ]; then
            echo "No test failures found in surefire-reports. Showing build log tail:" >> $GITHUB_STEP_SUMMARY
            for f in target/surefire-reports/*.dump*; do
              if [ -f "$f" ]; then
                echo "### 📄 $(basename "$f")" >> $GITHUB_STEP_SUMMARY
                echo '```text' >> $GITHUB_STEP_SUMMARY
                cat "$f" >> $GITHUB_STEP_SUMMARY
                echo '```' >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

      - name: Upload Surefire Test Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Install oasdiff
        run: |
          archive=oasdiff_1.40.0_linux_amd64.tar.gz
          curl -fsSL "https://github.com/oasdiff/oasdiff/releases/download/v1.40.0/$archive" -o "$RUNNER_TEMP/$archive"
          (cd "$RUNNER_TEMP" && printf '2d04b8f41b145809dd554e9be9ca04d21d1b4eedad5af983ddea36832d3c5e0d  %s\n' "$archive" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          sudo install -m 0755 "$RUNNER_TEMP/oasdiff" /usr/local/bin/oasdiff
          oasdiff --version

      - name: Check OpenAPI backward compatibility (oasdiff)
        run: |
          oasdiff breaking swagger-v1.json docs/openapi.json --severity-levels .oasdiff-severity.txt --fail-on ERR
