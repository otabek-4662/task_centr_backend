# Render Blueprint - task_center_backend
# Dashboard -> New -> Blueprint -> Connect repo -> ushbu fayl avtomatik o'qiiladi
# DB + Web Service birgalikda yaratiladi

services:
  - type: web
    name: task-center-backend
    env: docker
    region: ohio
    plan: free
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: false
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TELEGRAM_AUTH_MAX_AGE_SECONDS
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: CLIENT_IP_HEADER
        value: "X-Forwarded-For"
      - key: TELEGRAM_BOT_ENABLED
        value: "true"
      - key: TELEGRAM_BOT_WEBHOOK_URL
        value: "https://task-centr-backend.onrender.com/api/webhooks/telegram"
      - key: STORAGE_TYPE
        value: "db"
      - key: JWT_EXPIRATION
        value: 604800000
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: taskcenter-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: taskcenter-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: taskcenter-db
          property: password

databases:
  - name: taskcenter-db
    plan: free
    region: ohio
    databaseName: taskcenter
    user: postgres
