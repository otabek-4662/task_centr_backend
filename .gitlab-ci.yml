# GitLab CI/CD — task_centr_backend
# Stage 1: compile (build tekshiruvi)
# Stage 2: test (H2 in-memory DB bilan, PostgreSQL shart emas)

default:
  image: eclipse-temurin:17-jdk
  # Maven dependency larini cache qilamiz — har safar qayta yuklamaydi
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dmaven.test.failure.ignore=false"
  # Test profili application-test.yml ni ishlatadi (H2 + Flyway o'chirilgan)
  SPRING_PROFILES_ACTIVE: test

stages:
  - build
  - test

# ─── BUILD ───────────────────────────────────────────────────────────────────
build:
  stage: build
  script:
    - chmod +x mvnw
    - ./mvnw -q compile $MAVEN_OPTS
  rules:
    # Har qanday branchga push bo'lganda ishga tushadi
    - if: '$CI_PIPELINE_SOURCE == "push"'
    # MR ochilganda yoki yangilanganda ham
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── TEST ────────────────────────────────────────────────────────────────────
test:
  stage: test
  script:
    - chmod +x mvnw
    - ./mvnw test $MAVEN_OPTS
  # Test natijalarini GitLab UI da ko'rsatadi (Tests tab)
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
