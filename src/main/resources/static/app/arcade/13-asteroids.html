<!DOCTYPE html>
<html lang="uz">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta charset="UTF-8">
<!-- daylight:early -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f9ff">


<!-- /daylight:early -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Asteroidlar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(ellipse at 70% 10%, rgba(150,110,255,.13), transparent 55%),
      radial-gradient(ellipse at 15% 90%, rgba(80,180,255,.1), transparent 50%),
      linear-gradient(160deg, #100d1f 0%, #060510 75%);
    color: #fff;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  h1 {
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    letter-spacing: 5px;
    font-weight: 800;
    margin-bottom: 8px;
    color: #c9b8ff;
    text-shadow: 0 0 24px rgba(150,110,255,.5);
  }

  .hud { display: flex; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
  .stat {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px;
    padding: 5px 14px;
    min-width: 76px;
    text-align: center;
    box-shadow: inset 0 0 12px rgba(0,0,0,.3);
  }
  .stat .label { display: block; font-size: .58rem; text-transform: uppercase; letter-spacing: 1.5px; color: #a898d8; }
  .stat .value { font-weight: 800; font-variant-numeric: tabular-nums; }
  #score { color: #c9b8ff; }
  #lives { color: #ff9aa8; }

  #wrap { position: relative; width: min(96vw, 620px); }
  canvas {
    width: 100%;
    display: block;
    border-radius: 12px;
    background: #05040e;
    box-shadow: 0 18px 50px rgba(0,0,0,.6), 0 0 30px rgba(150,110,255,.1);
    touch-action: none;
  }

  #screen {
    position: absolute; inset: 0;
    border-radius: 12px;
    background: rgba(5,4,14,.85);
    backdrop-filter: blur(3px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 10; text-align: center; padding: 18px;
  }
  #screen.hidden { display: none; }
  #screen h2 { font-size: clamp(1.5rem, 6vw, 2.2rem); color: #c9b8ff; text-shadow: 0 0 24px rgba(150,110,255,.6); margin-bottom: 10px; letter-spacing: 3px; }
  #screen p { color: #c0b8e0; margin-bottom: 8px; line-height: 1.55; font-size: .96rem; }
  #screen .best-line { color: #ffd166; font-size: .88rem; margin-bottom: 18px; }
  #screen button {
    background: linear-gradient(135deg, #9a7ae8, #6a4ac8);
    color: #fff; border: none; border-radius: 999px;
    padding: 13px 36px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
    box-shadow: 0 0 22px rgba(150,110,255,.5), 0 3px 0 #4a34a0;
    transition: transform .12s;
  }
  #screen button:hover { transform: scale(1.05); }

  #touchpad {
    display: none;
    gap: 12px;
    margin-top: 10px;
    width: min(96vw, 620px);
    justify-content: space-between;
  }
  #touchpad .tgroup { display: flex; gap: 10px; }
  #touchpad button {
    width: 62px; height: 62px;
    border-radius: 50%;
    border: 1px solid rgba(180,160,255,.4);
    background: rgba(150,110,255,.15);
    color: #c9b8ff;
    font-size: 1.5rem;
    font-weight: 800;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    display: inline-flex; align-items: center; justify-content: center;
  }
  #touchpad button svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  #touchpad button:active { background: rgba(150,110,255,.45); }
  #touchpad { display: flex; }
  @media (pointer: coarse) { .hint { display: none; } }

  .hint { margin-top: 8px; font-size: .78rem; color: #7868a8; text-align: center; }
 .hint .karr { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; }
</style>
<!-- daylight:late -->

<!-- /daylight:late -->
</head>
<body>

<h1>ASTEROIDLAR</h1>
<div class="hud">
  <div class="stat"><span class="label">Hisob</span><span class="value" id="score">0</span></div>
  <div class="stat"><span class="label">Bosqich</span><span class="value" id="level">1</span></div>
  <div class="stat"><span class="label">Jon</span><span class="value" id="lives">3</span></div>
  <div class="stat"><span class="label">Rekord</span><span class="value" id="best">0</span></div>
</div>
<div id="wrap">
  <canvas id="game" width="620" height="560"></canvas>
  <div id="screen">
    <h2>ASTEROIDLAR</h2>
    <p>Toshlarni parchalab, bo‘laklaridan qoching.<br>SHIFT = hyperspace when things get tight.</p>
    <p class="best-line" id="screenBest"></p>
    <button id="startBtn">UCHIRISH (Space)</button>
  </div>
</div>
<div id="touchpad">
  <div class="tgroup">
    <button data-k="left" aria-label="Chapga burilish"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button data-k="right" aria-label="O‘ngga burilish"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="tgroup">
    <button data-k="thrust" aria-label="Thrust"><svg viewBox="0 0 24 24"><path d="M12 4l7 10h-4v6h-6v-6H5z"/></svg></button>
    <button data-k="fire" aria-label="Fire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </div>
</div>
<div class="hint" id="asteroid-help"><svg class="karr" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><svg class="karr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg> rotate · <svg class="karr" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg> thrust · Space fire · Shift hyperspace</div>







<script src="score-bridge.js"></script>
<script src="13-asteroids.js"></script>
</body>
</html>
