<!DOCTYPE html>
<html lang="uz">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta charset="utf-8">
<!-- daylight:early -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f9ff">


<!-- /daylight:early -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minoralar mudofaasi</title>
<style>
  :root{
    --panel:#101a26;
    --line:#22303f;
    --text:#dbe6f3;
    --dim:#7d90a6;
    --gold:#ffcc57;
    --red:#ff6b8a;
    --green:#5fe0a0;
    --blue:#6fc6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 620px at 50% -10%,#1a2c3f 0%,#0a1018 55%,#05080c 100%);
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:10px;
    overflow:auto;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    width:min(100%, 980px, calc((100vh - 168px) * 1.5));
    min-width:320px;
    display:flex;flex-direction:column;gap:8px;
  }

  /* ---------- HUD ---------- */
  .hud{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    background:linear-gradient(180deg,#101b26,#0b131b);
    border:1px solid #1e2c3a;
    border-radius:12px;
    padding:8px 12px;
    box-shadow:0 8px 24px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .stat{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
  .stat b{font-size:16px;font-weight:700;line-height:1}
  .stat small{color:var(--dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.09em}
  .ico{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;font-size:13px;line-height:1;font-style:normal}
  .ico.gold{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff3c4,#ffc94a 55%,#b87b13);box-shadow:0 0 8px rgba(255,201,74,.45)}
  .ico.heart{color:var(--red);text-shadow:0 0 8px rgba(255,107,138,.5)}
  .ico.star{color:#8fd0ff}
  .ico.wave{width:13px;height:13px;border:2px solid var(--blue);border-radius:50%;position:relative}
  .ico.wave:after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--blue)}
  .status{color:var(--dim);font-size:12px;margin-left:auto;text-align:right;line-height:1.3}

  /* ---------- stage ---------- */
  .stage{
    position:relative;border-radius:14px;overflow:hidden;
    border:1px solid #1b2836;
    box-shadow:0 18px 44px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.02);
    background:#070b10;
  }
  canvas#game{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}

  /* ---------- tower info ---------- */
  .tinfo{
    position:absolute;top:8px;right:8px;width:186px;
    background:rgba(11,19,27,.95);
    border:1px solid #2a3c50;border-radius:12px;
    padding:9px 10px;z-index:3;
    box-shadow:0 12px 30px rgba(0,0,0,.55);
    font-size:11.5px;
  }
  .tinfo-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
  .tinfo-head span:first-child{font-size:13px;font-weight:700;letter-spacing:.01em}
  .lv{color:var(--blue);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
  .ti-rows{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .ti-rows div{display:flex;justify-content:space-between;color:var(--dim)}
  .ti-rows b{color:#cfe2f5;font-variant-numeric:tabular-nums;font-weight:600}
  .ti-btns{display:flex;flex-direction:column;gap:5px}
  .ti-btns .act{width:100%;padding:6px 8px;font-size:11px}

  /* ---------- overlay ---------- */
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,9,14,.8);
    backdrop-filter:blur(3px);
    padding:14px;text-align:center;z-index:5;
  }
  .panel{
    max-width:440px;width:100%;
    padding:20px 24px;border-radius:18px;
    background:linear-gradient(180deg,rgba(16,26,38,.97),rgba(8,14,20,.97));
    border:1px solid #22344a;
    box-shadow:0 26px 60px rgba(0,0,0,.65);
    animation:pop .28s ease-out;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#5fb6e8;margin-bottom:6px}
  h1{font-size:clamp(23px,4.4vw,36px);line-height:1.05;letter-spacing:-.02em;margin-bottom:9px}
  .accent{color:var(--blue)}
  .panel p{color:#9fb3c8;font-size:13px;line-height:1.55}
  .howto{display:flex;flex-direction:column;gap:6px;margin:14px 0 16px;text-align:left}
  .howto div{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#b8c9da}
  .howto b{flex:none;width:18px;height:18px;border-radius:50%;background:#1c3a52;color:#7fd1ff;display:grid;place-items:center;font-size:10px}
  .endstats{display:flex;gap:8px;margin:15px 0 16px}
  .endstats div{flex:1;background:#0c1620;border:1px solid #1c2c3c;border-radius:10px;padding:7px 4px}
  .endstats b{display:block;font-size:17px;line-height:1.3}
  .endstats span{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .tiny{margin-top:10px;font-size:10.5px;color:#5f7288}
  button.big{
    background:linear-gradient(180deg,#2a86c4,#155f92);
    border:1px solid #3f9ad4;color:#fff;
    padding:11px 26px;border-radius:12px;font:inherit;font-size:14px;font-weight:700;
    cursor:pointer;letter-spacing:.02em;
    box-shadow:0 8px 22px rgba(28,120,180,.4);
    transition:filter .15s, transform .1s;
  }
  button.big:hover{filter:brightness(1.12)}
  button.big:active{transform:translateY(1px)}

  /* ---------- bottom bar ---------- */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .cards{display:flex;gap:7px;flex-wrap:wrap}
  .card{
    display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#131f2b,#0c151e);
    border:1px solid #223242;
    border-radius:12px;
    padding:5px 11px 5px 5px;
    color:var(--text);font:inherit;cursor:pointer;
    transition:transform .12s,border-color .12s,box-shadow .12s,opacity .12s;
  }
  .card canvas{width:32px;height:32px;display:block}
  .card .meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
  .card .cname{font-size:12.5px;font-weight:600}
  .card .ccost{font-size:11px;color:var(--gold);font-variant-numeric:tabular-nums}
  .card:hover{border-color:#3a5470;transform:translateY(-1px)}
  .card.active{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue),0 0 18px rgba(111,198,255,.22)}
  .card.poor{opacity:.42}
  .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .act{
    background:linear-gradient(180deg,#182634,#101a24);
    border:1px solid #26384a;color:#cfe0f0;
    padding:8px 11px;border-radius:10px;font:inherit;font-size:11.5px;font-weight:600;
    cursor:pointer;white-space:nowrap;
    transition:border-color .12s,filter .12s,opacity .12s;
  }
  .act:hover:not(:disabled){border-color:#3c5a78}
  .act:disabled{opacity:.4;cursor:default}
  .act.primary{background:linear-gradient(180deg,#1d5c86,#134062);border-color:#2f7fb0;color:#e8f6ff}
  .act.primary:hover:not(:disabled){filter:brightness(1.15)}
  .act.on{border-color:var(--blue);color:#bfe8ff}

  @media (max-width:720px){
    .hud{gap:10px;padding:7px 9px}
    .status{display:none}
    .card .meta{display:none}
    .card{padding:5px}
    .tinfo{width:150px;font-size:10.5px}
  }
</style>
<!-- daylight:late -->

<!-- /daylight:late -->
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="stat"><i class="ico gold"></i><b id="gold">0</b><small>oltin</small></div>
    <div class="stat"><i class="ico heart"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 14.5C4 11.5 1.2 8.7 1.2 5.8 1.2 3.7 2.9 2 5 2c1.2 0 2.3.6 3 1.6C8.7 2.6 9.8 2 11 2c2.1 0 3.8 1.7 3.8 3.8 0 2.9-2.8 5.7-6.8 8.7z" fill="currentColor"/></svg></i><b id="lives">20</b><small>jon</small></div>
    <div class="stat"><i class="ico wave"></i><b id="wave">0</b><small>/ 20</small></div>
    <div class="stat"><i class="ico star"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.4l2 4.1 4.5.6-3.3 3.2.8 4.5L8 11.6l-4 2.2.8-4.5L1.5 6.1l4.5-.6z" fill="currentColor"/></svg></i><b id="score">0</b><small>hisob</small></div>
    <div class="status" id="status">Pick a tower, then click a grass tile beside the path.</div>
  </div>

  <div class="stage">
    <canvas id="game" width="960" height="640"></canvas>

    <div class="tinfo" id="tinfo" hidden>
      <div class="tinfo-head"><span id="tiName">Kamonchi</span><span class="lv" id="tiLv">Lv 1</span></div>
      <div class="ti-rows">
        <div><span>Zarar</span><b id="tiDmg">10</b></div>
        <div><span>Masofa</span><b id="tiRange">118</b></div>
        <div><span>Tezlik</span><b id="tiRate">2.2/s</b></div>
      </div>
      <div class="ti-btns">
        <button class="act" id="tiUp">Yaxshilash</button>
        <button class="act" id="tiSell">Sotish</button>
      </div>
    </div>

    <div class="overlay" id="overlay"></div>
  </div>

  <div class="bar">
    <div class="cards" id="cards">
      <button class="card" data-type="arrow" title="Archer (1) - fast single target">
        <canvas width="72" height="72"></canvas>
        <span class="meta"><span class="cname">Kamonchi</span><span class="ccost">50g</span></span>
      </button>
      <button class="card" data-type="cannon" title="Mortar (2) - splash damage">
        <canvas width="72" height="72"></canvas>
        <span class="meta"><span class="cname">To‘p</span><span class="ccost">95g</span></span>
      </button>
      <button class="card" data-type="frost" title="Frost (3) - slows enemies">
        <canvas width="72" height="72"></canvas>
        <span class="meta"><span class="cname">Muz</span><span class="ccost">75g</span></span>
      </button>
    </div>
    <div class="actions">
      <button class="act primary" id="waveBtn">Hujumni boshlash</button>
      <button class="act" id="pauseBtn">Pauza</button>
      <button class="act" id="speedBtn">1&times;</button>
      <button class="act" id="soundBtn">Ovoz yoqilgan</button>
      <button class="act" id="restartBtn">Qaytadan</button>
    </div>
  </div>
</div>






<script src="score-bridge.js"></script>
<script src="71-tower-defense.js"></script>
</body>
</html>
