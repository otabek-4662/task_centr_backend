<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; width: 100%; height: 100%; min-height: 100dvh; background: #07090d; color: #e8eef7;
    font-family: "Courier New", ui-monospace, monospace; overflow: hidden;
  }
  body { display: grid; place-items: center; }
  #wrap {
    position: relative;
    width: 384px;
    height: 224px;
    aspect-ratio: 384 / 224;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 0 0 2px #1b2738, 0 20px 60px rgba(0,0,0,.55);
    background: #07090d;
    overflow: hidden;
  }
  canvas#game {
    width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; display: block; outline: none; touch-action: none;
  }
  #help {
    position: fixed; left: 12px; bottom: 10px; right: 12px;
    font-size: 12px; opacity: .72; pointer-events: none; text-align: center;
  }
  @media (max-width: 480px), (max-height: 420px) {
    #help { display: none; }
  }
  #touch-controls, #rotate-device { display: none; }
  @media (pointer: coarse), (pointer: fine) {
    #touch-controls {
      display: block; position: fixed; inset: 0; z-index: 50;
      pointer-events: none; user-select: none; -webkit-user-select: none;
    }
    .touch-button {
      position: absolute; display: grid; place-items: center;
      width: clamp(42px, 9vw, 64px); height: clamp(42px, 9vw, 64px);
      border: 2px solid rgba(240,193,74,.72); border-radius: 50%;
      color: #fff7d6; background: rgba(7,9,13,.48);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.07), 0 3px 12px rgba(0,0,0,.42);
      font: 800 clamp(12px,2.6vw,18px)/1 monospace;
      text-shadow: 1px 2px 0 #000; pointer-events: auto; touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-button.active { transform: scale(.92); background: rgba(240,193,74,.42); }
    .touch-dpad { left: max(10px,env(safe-area-inset-left)); bottom: max(10px,env(safe-area-inset-bottom)); width: 154px; height: 116px; position: absolute; }
    .touch-left { left: 0; bottom: 0; }
    .touch-right { left: 96px; bottom: 0; }
    .touch-up { left: 48px; bottom: 48px; }
    .touch-down { left: 48px; bottom: 0; }
    .touch-fire { right: max(12px,env(safe-area-inset-right)); bottom: max(42px,calc(env(safe-area-inset-bottom) + 42px)); width: clamp(58px,11vw,76px); height: clamp(58px,11vw,76px); }
    .touch-jump { right: max(92px,calc(env(safe-area-inset-right) + 82px)); bottom: max(10px,env(safe-area-inset-bottom)); }
    .touch-grenade { right: max(12px,env(safe-area-inset-right)); bottom: max(118px,calc(env(safe-area-inset-bottom) + 118px)); width: clamp(38px,7.5vw,52px); height: clamp(38px,7.5vw,52px); }
    .touch-pause { right: max(12px,env(safe-area-inset-right)); top: max(8px,env(safe-area-inset-top)); width: 38px; height: 38px; border-radius: 8px; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #wrap { opacity: .24; }
    #touch-controls { display: none; }
    #rotate-device {
      display: grid; position: fixed; inset: 0; z-index: 70; place-items: center;
      padding: 28px; text-align: center; color: #f0c14a; background: rgba(7,9,13,.92);
      font: 800 18px/1.5 monospace; letter-spacing: .04em;
    }
  }
</style>
