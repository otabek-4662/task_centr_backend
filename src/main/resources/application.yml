spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  application:
    name: backend
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskcenter}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 300000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # N+1 tekshiruvi uchun show_sql: true qiling va loglarni ko'ring
        # generate_statistics: true qo'shsangiz har endpoint uchun SQL sonini ko'rasiz
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

logging:
  level:
    # SQL so'rovlarni debug qilish uchun quyidagi ikki satrni yoqing:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    # N+1 statistikasi uchun:
    # org.hibernate.stat: DEBUG
    com.taskcenter: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: INFO

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000} # 7 days in milliseconds

github:
  # GitHub -> Settings -> Webhooks -> Secret dagi qiymat bilan bir xil bo'lishi kerak
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
  scheduler:
    reminder-cron: ${TELEGRAM_REMINDER_CRON:0 0 18 * * *}
    digest-cron: ${TELEGRAM_DIGEST_CRON:0 0 8 * * *}

ratelimit:
  auth:
    enabled: true
  api:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      hikaricp: true
      jvm: true
      cache: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    persist-authorization: true
    display-request-duration: true

storage:
  type: ${STORAGE_TYPE:local}
