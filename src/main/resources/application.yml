spring:
  aop:
    proxy-target-class: true
  jmx:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  application:
    name: backend
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskcenter}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      max-lifetime: 1800000
      idle-timeout: 300000
      leak-detection-threshold: 60000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          plan_cache_max_size: 256
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  lifecycle:
    timeout-per-shutdown-phase: 20s

logging:
  level:
    com.taskcenter: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000} # 7 days in milliseconds

github:
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender:
    email: ${BREVO_SENDER_EMAIL:}
    name: ${BREVO_SENDER_NAME:Task Center}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}
    token: ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:}
    webhook-url: ${TELEGRAM_BOT_WEBHOOK_URL:}
    webhook-secret: ${TELEGRAM_BOT_WEBHOOK_SECRET:}
  miniapp:
    max-age-sec: ${TELEGRAM_MINIAPP_MAX_AGE_SEC:86400}
    base-url: ${TELEGRAM_MINIAPP_BASE_URL:https://task-centr-backend.onrender.com}
    short-name: ${TELEGRAM_MINIAPP_SHORT_NAME:app}
  reminders:
    deadline-enabled: ${TELEGRAM_DEADLINE_REMINDERS_ENABLED:true}
  scheduler:
    reminder-cron: ${TELEGRAM_REMINDER_CRON:0 0 18 * * *}
    digest-cron: ${TELEGRAM_DIGEST_CRON:0 0 8 * * *}

ratelimit:
  auth:
    enabled: true
  api:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    enable:
      hikaricp: true
      jvm: true
      cache: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    doc-expansion: none
    filter: true
    persist-authorization: true
    display-request-duration: true

# STORAGE_TYPE variantlari:
# - local: lokal disk (./uploads, dev va test uchun)
# - db: PostgreSQL stored_files jadvalida doimiy saqlash (Render Free uchun S3 kerak bo'lmasdan)
# - s3: Cloudflare R2 / AWS S3 / Supabase S3 / MinIO
storage:
  type: ${STORAGE_TYPE:local}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:auto}
    bucket: ${S3_BUCKET:task-center-files}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    public-url: ${S3_PUBLIC_URL:}

app:
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

telegrambots:
  enabled: false
